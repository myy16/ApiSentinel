name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Go) Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v -race ./...

      - name: Agent Test & Build
        run: |
          cd agent
          go test -v ./...
          go build -o bin/apisentinel ./cmd/apisentinel

  frontend:
    name: Frontend (Next.js) Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build:shared

      - name: Frontend Typecheck
        run: npm run type-check --workspace=apisentinel-frontend
