syntax = "proto3";

package apisentinel.replay.v1;

option go_package = "github.com/apisentinel/apisentinel/pkg/genproto/replay/v1;replayv1";

message ReplayRequest {
  string job_id = 1;
  string source_request_id = 2;
  string http_method = 3;
  string target_url = 4;
  map<string, string> headers = 5;
  bytes body = 6;
}

message ReplayResponse {
  string job_id = 1;
  int32 response_status = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  int64 latency_ms = 5;
  string error_message = 6;
}
