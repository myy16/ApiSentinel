services:
  postgres:
    image: postgres:16-alpine
    container_name: apisentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apisentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apisentinel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-apisentinel_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apisentinel} -d ${POSTGRES_DB:-apisentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: apisentinel-valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local
